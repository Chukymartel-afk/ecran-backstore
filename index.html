<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>PROMO · Backstore</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Montserrat:wght@900&display=swap">
<style>
/* La télé du backstore (13 nov. 2026). Affichage seulement : personne n'y touche.
   Le style des iPads. Tout en cqw dans un cadre 16:9 qui remplit l'écran. */
:root {
  color-scheme: light;
  --ecran: #E9ECE8;
  --blanc: #FFFFFF;
  --encre: #1E221F;
  --fonce: #232724;
  --gris: #767C77;
  --gris-pale: #9AA09B;
  --vert: #28A55A;
  --rouge: #E5484D;
  --violet: #7A5AF0;
  --texte: 'Outfit', ui-rounded, system-ui, -apple-system, 'Segoe UI', sans-serif;
  --noir: 'Montserrat', 'Outfit', system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--ecran); color: var(--encre); font-family: var(--texte); overflow: hidden; cursor: none; }
[hidden] { display: none !important; }

.tele {
  position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
  width: min(100vw, 177.78vh); aspect-ratio: 16 / 9; container-type: inline-size; overflow: hidden;
}
.ecran { position: absolute; inset: 0; display: grid; grid-template-rows: auto 1fr; padding: 1.8cqw 2.2cqw 2.2cqw; gap: 1.6cqw; }

.entete { display: flex; align-items: center; justify-content: space-between; gap: 2cqw; }
.logo { height: 3.2cqw; width: auto; color: #000; display: block; flex: none; }
.cotes { flex: 1; display: flex; justify-content: center; gap: 1cqw; min-width: 0; }
.cote { background: var(--blanc); border-radius: 1.5cqw; box-shadow: 0 .4cqw 1cqw rgba(0,0,0,.05); padding: .75cqw 1.4cqw; min-width: 0; line-height: 1; }
.cote small { display: block; font-size: 1.05cqw; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; color: var(--gris-pale); }
.cote b { display: block; font-size: 2.1cqw; font-weight: 800; letter-spacing: -.03em; margin-top: .4cqw; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cote b em { font-style: normal; font-weight: 700; color: var(--gris); font-size: 1.6cqw; margin-left: .4cqw; }
.cote.zero b { color: var(--gris-pale); }
.cote.retard b { color: var(--rouge); }
.cote.panne { background: var(--rouge); }
.cote.panne small, .cote.panne b { color: #fff; }
.heure { text-align: right; line-height: 1; flex: none; }
.heure b { display: block; font-family: var(--noir); font-weight: 900; font-size: 4.4cqw; letter-spacing: -.05em; font-variant-numeric: tabular-nums; }
.heure small { display: block; font-size: 1.5cqw; font-weight: 600; color: var(--gris); margin-top: .35cqw; }

.corps { display: grid; grid-template-columns: 1fr 1.3fr; gap: 1.8cqw; min-height: 0; }
.gauche { display: grid; grid-template-rows: auto 1fr; gap: 1.8cqw; min-height: 0; }
.gauche.seul { grid-template-rows: 1fr; }
.carte { background: var(--blanc); border-radius: 2.4cqw; box-shadow: 0 .5cqw 1.4cqw rgba(0,0,0,.06); min-height: 0; }
.libelle { font-size: 1.35cqw; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; color: var(--gris-pale); }

.etiq { padding: 1.6cqw 2.2cqw; display: grid; gap: .7cqw; transition: background .3s, color .3s; }
.etiq .mot { font-size: 3.4cqw; font-weight: 800; letter-spacing: -.035em; line-height: 1.02; text-wrap: balance; }
.etiq .sous { font-size: 1.7cqw; font-weight: 600; color: var(--gris); }
.etiq.calme .mot { color: var(--gris-pale); }
.etiq.alerte { background: var(--rouge); color: #fff; animation: pouls 1.6s ease-in-out infinite; }
.etiq.alerte .libelle, .etiq.alerte .sous { color: rgba(255,255,255,.85); }
@keyframes pouls { 0%,100% { box-shadow: 0 0 0 0 rgba(229,72,77,.55); } 50% { box-shadow: 0 0 0 1.2cqw rgba(229,72,77,0); } }

.cmd { display: grid; grid-template-rows: auto 1fr; gap: 1cqw; min-height: 0; overflow: hidden; }
.cmd > .libelle { display: flex; justify-content: space-between; padding: 0 1cqw; }
.heures { display: grid; gap: .9cqw; align-content: start; min-height: 0; }
.h {
  position: relative; overflow: hidden; height: 5.3cqw; border-radius: 1.8cqw; background: var(--blanc); color: var(--encre);
  display: flex; align-items: center; gap: 1.2cqw; padding: 0 1.2cqw 0 1.9cqw; box-shadow: 0 .45cqw 1.2cqw rgba(0,0,0,.06);
}
.h b { position: relative; font-family: var(--noir); font-weight: 900; font-size: 3.1cqw; letter-spacing: -.05em; font-variant-numeric: tabular-nums; line-height: 1; }
/* 14 nov. — Keven ne voyait pas l'état : il est écrit gros, en noir (À préparer, En préparation, Terminée). */
.h i { position: relative; flex: 1; font-style: normal; font-size: 2.2cqw; font-weight: 800; letter-spacing: -.02em; color: var(--encre); }
.h i { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
/* 14 nov. — le temps qui reste, gros et à droite, sans pastille. */
.h span.reste { background: none; padding: 0 .4cqw 0 0; font-family: var(--noir); font-weight: 900; font-size: 2.4cqw; letter-spacing: -.04em; color: var(--encre); }
.h.r span.reste { background: none; color: #fff; }
.h.demain span.reste { color: var(--gris-pale); font-family: var(--texte); font-weight: 700; font-size: 1.9cqw; letter-spacing: -.02em; }
.h span { position: relative; font-size: 1.6cqw; font-weight: 700; color: var(--gris); background: var(--ecran); border-radius: 999px; padding: .5cqw 1.2cqw; white-space: nowrap; }
.h.r { background: linear-gradient(135deg, #F06266, #D93A40); color: #fff; box-shadow: inset 0 0 0 .1cqw rgba(255,255,255,.14), 0 .7cqw 1.6cqw rgba(217,58,64,.3); }
.h.r::before { content: ""; position: absolute; width: 16cqw; height: 16cqw; right: -5cqw; top: -9cqw; border-radius: 50%; background: radial-gradient(closest-side, rgba(0,0,0,.22), rgba(0,0,0,0)); }
.h.r i { color: #fff; }
/* 14 nov. — Keven : le nom de la boîte sur la ligne, au-dessus de l'état. */
.h i.deux { display: grid; line-height: 1.05; min-width: 0; }
.h i.deux em { font-style: normal; font-size: 2.1cqw; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.h i.deux > span { all: unset; font-size: 1.5cqw; font-weight: 700; letter-spacing: 0; color: var(--gris); }
.h.r i.deux > span { color: rgba(255,255,255,.85); }
.h.demain i.deux em, .h.demain i.deux > span { color: var(--gris-pale); }
.h.r span { color: #fff; background: rgba(0,0,0,.18); }
/* 14 nov. — Keven : la commande terminée passe au vert (5 min), puis s'en va. */
.h.v { background: var(--vert); color: #fff; box-shadow: 0 .7cqw 1.6cqw rgba(40,165,90,.3); }
.h.v i { color: #fff; }
.h.v span { color: #fff; background: rgba(0,0,0,.16); font-family: var(--noir); font-weight: 900; }
.h.v.neuve { animation: faite .5s cubic-bezier(.16,1,.3,1); }
/* 20 nov. — Keven : préparée mais PAS vérifiée = jaune plein (comme la bande LIQUIDATION) ; verte seulement une fois vérifiée.
   Après 5 min sans vérification, elle pulse. */
.h.j { background: #FFD400; color: var(--encre); box-shadow: 0 .7cqw 1.6cqw rgba(214,170,0,.35); }
.h.j i { color: var(--encre); }
.h.j span { color: var(--encre); background: rgba(0,0,0,.12); font-family: var(--noir); font-weight: 900; }
.h.j.vieille { animation: pouls-j 1.4s ease-in-out infinite; }
@keyframes pouls-j { 0%,100% { box-shadow: 0 .7cqw 1.6cqw rgba(214,170,0,.35), 0 0 0 0 rgba(255,212,0,.7); } 50% { box-shadow: 0 .7cqw 1.6cqw rgba(214,170,0,.35), 0 0 0 1.3cqw rgba(255,212,0,0); } }
/* 13 nov. — Keven : une commande pour demain, un peu grisée. */
.h.demain { background: rgba(255,255,255,.55); box-shadow: none; }
.h.demain b, .h.demain i { color: var(--gris-pale); }
.vide { background: var(--blanc); border-radius: 2.4cqw; box-shadow: 0 .5cqw 1.4cqw rgba(0,0,0,.06); padding: 2cqw 2.2cqw; font-size: 3cqw; font-weight: 800; letter-spacing: -.03em; color: var(--gris-pale); }

.droitecol { display: grid; grid-template-rows: auto 1fr; gap: 1cqw; min-height: 0; }
.droitecol > .libelle { padding-left: 1cqw; position: relative; z-index: 3; }
.appels { position: relative; min-height: 0; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; gap: 1.2cqw; padding: .5cqw; }
.appels::before { content: ""; position: absolute; inset: 0 0 auto; height: 7cqw; z-index: 2; pointer-events: none; background: linear-gradient(var(--ecran), var(--ecran) 30%, rgba(233,236,232,0)); }
.banniere { flex: none; height: 9.6cqw; border-radius: 2.4cqw; background: var(--blanc); display: flex; align-items: center; gap: 1.8cqw; padding: 0 1.1cqw; box-shadow: 0 .45cqw 1.2cqw rgba(0,0,0,.06); }
.banniere.neuve { animation: arrive .42s cubic-bezier(.33,1,.68,1); }
@keyframes arrive { from { opacity: 0; transform: translateY(5cqw); } to { opacity: 1; transform: none; } }
/* 14 nov. — Keven : la photo du produit posée dans la bannière, sans cadre ni fond. */
.photo { position: relative; width: 8.2cqw; height: 8.2cqw; flex: none; display: grid; place-items: center; font-size: 3.6cqw; font-weight: 800; color: var(--gris-pale); }
.photo img { width: 100%; height: 100%; object-fit: contain; display: block; }
.fois { position: absolute; right: -.7cqw; top: -.7cqw; min-width: 3.2cqw; height: 3.2cqw; padding: 0 .7cqw; border-radius: 999px; background: var(--fonce); color: #fff; display: grid; place-items: center; font-family: var(--noir); font-weight: 900; font-size: 1.7cqw; box-shadow: 0 0 0 .3cqw var(--blanc); }
.nom { flex: 1; min-width: 0; font-size: 3.4cqw; font-weight: 700; letter-spacing: -.035em; line-height: 1.05; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.no { width: 7.6cqw; height: 7.6cqw; border-radius: 1.9cqw; flex: none; display: grid; place-items: center; font-family: var(--noir); font-weight: 900; font-size: 4.8cqw; color: #fff; background: var(--fonce); }
.no.p2 { background: var(--violet); }
/* 14 nov. — Keven : la bannière passe au vert quand le Backstore a coché. */
.banniere.faite { background: var(--vert); color: #fff; box-shadow: 0 .7cqw 1.6cqw rgba(40,165,90,.3); animation: faite .5s cubic-bezier(.16,1,.3,1); }
.banniere.faite .no, .banniere.faite .no.p2 { background: rgba(0,0,0,.16); }
.banniere.faite .photo { color: #fff; }
@keyframes faite { from { transform: scale(.96); } to { transform: none; } }
.rien { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
.rien b { font-size: 3.4cqw; font-weight: 700; letter-spacing: -.035em; color: var(--gris-pale); }
@media (prefers-reduced-motion: reduce) { .banniere.neuve, .etiq.alerte { animation: none; } }

/* Le code (une seule fois, à l'installation de la télé) */
.porte { position: absolute; inset: 0; display: grid; place-items: center; cursor: auto; }
.porte form { background: var(--blanc); border-radius: 2.4cqw; box-shadow: 0 .5cqw 1.4cqw rgba(0,0,0,.06); padding: 3cqw 3.4cqw; display: grid; gap: 1.6cqw; justify-items: center; width: 34cqw; }
.porte .logo { height: 3cqw; }
.porte label { font-size: 1.6cqw; font-weight: 700; color: var(--gris); }
.porte input { width: 100%; font: 900 4.4cqw var(--noir); letter-spacing: .4em; text-align: center; padding: 1cqw; border: .2cqw solid #DADED8; border-radius: 1.6cqw; color: var(--encre); background: var(--ecran); }
.porte input:focus { outline: none; border-color: var(--encre); }
.porte button { width: 100%; font: 800 2cqw var(--texte); color: #fff; background: var(--encre); border: 0; border-radius: 999px; padding: 1.1cqw; cursor: pointer; }
.porte .erreur { font-size: 1.5cqw; font-weight: 700; color: var(--rouge); min-height: 1.8cqw; }
/* 14 nov. — la fête des 100 clients. Keven : « trop gadget, c'est laid » (éclats, lueurs).
   Donc rien que de la typo : l'écran passe au noir, un chiffre géant roule et se pose, une
   ligne en dessous. Une seule couleur. Que des transform et des opacity. */
.fete { position: absolute; inset: 0; z-index: 20; display: grid; place-items: center; overflow: hidden; color: #fff; background: #000; animation: feteEntre .6s cubic-bezier(.16,1,.3,1) both; }
.fete.sort { animation: feteSort .8s cubic-bezier(.4,0,.2,1) both; }
.fete .centre { text-align: center; line-height: 1; animation: feteRespire 8s linear both; }
@keyframes feteRespire { from { transform: scale(1); } to { transform: scale(1.045); } }
.fete .chiffre { display: flex; justify-content: center; font-family: var(--texte); font-weight: 700; font-size: 36cqw; letter-spacing: 0; line-height: 1.02; font-variant-numeric: tabular-nums;
  animation: fetePose 1.5s cubic-bezier(.16,1,.3,1) both .1s; }
@keyframes fetePose { 0% { opacity: 0; transform: scale(1.22); filter: blur(1.4cqw); } 35% { opacity: 1; } 100% { opacity: 1; transform: none; filter: blur(0); } }
.roue { display: block; height: 1.02em; overflow: hidden; margin: 0 -.034em; padding: 0 .01em; }
.roue > i { display: block; font-style: normal; transition: transform 1.5s cubic-bezier(.16,1,.3,1); will-change: transform; }
.roue > i > b { display: block; height: 1.02em; font-weight: 700; }
.fete .mot { font-size: 3.1cqw; font-weight: 600; letter-spacing: -.02em; color: rgba(255,255,255,.55); margin-top: .6cqw; animation: feteMonte 1s cubic-bezier(.16,1,.3,1) both 1.5s; }
@keyframes feteEntre { from { opacity: 0; } to { opacity: 1; } }
@keyframes feteSort { to { opacity: 0; } }
@keyframes feteMonte { from { opacity: 0; transform: translateY(1.6cqw); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .fete, .fete * { animation: none !important; } .roue > i { transition: none; } }
/* 14 nov. — une commande en ligne rentre. Keven : plein écran, fond transparent, entre par la
   gauche, ralentit au centre, repart à droite ; « trop longue », « clean, high-tech, pas gadget ».
   2,6 s. Un voile sombre, une étiquette, l'heure, un trait fin qui se trace. transform + opacity. */
.arrivee { position: absolute; inset: 0; z-index: 19; display: grid; place-items: center; overflow: hidden; color: #fff; background: rgba(0,0,0,.92); animation: feteEntre .25s ease-out both; }
.arrivee.sort { animation: feteSort .35s ease-in both; }
.arrivee .centre { display: grid; justify-items: center; line-height: 1; white-space: nowrap; will-change: transform, opacity; animation: arriveePasse 2.5s both .05s; }
/* 14 nov. — Keven : « clean », mais dans le branding PROMO (pas de lettres fines) : Outfit 800 comme
   les iPads, l'étiquette comme les libellés de la télé, le vert plein en seul accent, un trait fin. */
.arrivee .mot { font-size: 1.5cqw; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--vert); margin-right: -.14em; }
.arrivee .titre { font-weight: 800; font-size: 8.6cqw; line-height: 1.05; letter-spacing: -.045em; margin-top: 1.2cqw; }
.arrivee .boite { font-weight: 700; font-size: 3.4cqw; letter-spacing: -.035em; margin-top: 2cqw; }
.arrivee .cueille { font-size: 1.8cqw; font-weight: 600; color: rgba(255,255,255,.55); margin-top: 1cqw; }
.arrivee .cueille b { font-family: var(--noir); font-weight: 900; letter-spacing: -.04em; color: #fff; font-variant-numeric: tabular-nums; margin-left: .3em; }
.arrivee .trait { width: 100%; height: .15cqw; margin-top: 2cqw; background: rgba(255,255,255,.3); transform-origin: left; animation: arriveeTrait 2.5s both .05s; }
@keyframes arriveePasse {
  0% { opacity: 0; transform: translateX(-38cqw); animation-timing-function: cubic-bezier(.16,1,.3,1); }
  26% { opacity: 1; transform: translateX(-1.2cqw); animation-timing-function: linear; }
  76% { opacity: 1; transform: translateX(1.2cqw); animation-timing-function: cubic-bezier(.7,0,.84,0); }
  100% { opacity: 0; transform: translateX(38cqw); }
}
@keyframes arriveeTrait {
  0%, 12% { transform: scaleX(0); animation-timing-function: cubic-bezier(.65,0,.35,1); }
  48% { transform: scaleX(1); }
  100% { transform: scaleX(1); }
}
@media (prefers-reduced-motion: reduce) { .arrivee, .arrivee * { animation: none !important; } }
/* 19 nov. (soir) — L'OUVERTURE ET LE CLOSE, v2. Keven : « fais de quoi plus sick, insane, bien fait » ;
   « Tâches du close » en titre (plus de PROMO), l'heure de la même grosseur, les avatars de ceux
   qui ont rejoint à côté ; une tâche prise descend au bas de sa colonne ; finie, elle passe au vert,
   se coche et file dans la bande du bas (en largeur, son temps, le crochet), qui disparaît à droite ;
   le compte au-dessus de la barre, en bas à droite. Noir profond, chiffres blancs, vert PROMO pour
   ce qui avance (ses widgets). Que des transform et des opacity, jamais de ressort. */
html.nuit, html.nuit body { background: #050606; }
.quart { position: absolute; inset: 0; background: #0B0D0C; color: #fff; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; padding: 2.1cqw 2.4cqw 1.7cqw; gap: 1.5cqw; overflow: hidden; }
.quart::before { content: ""; position: absolute; inset: -20% -10% auto; height: 60%; background: radial-gradient(60% 60% at 50% 0%, rgba(255,255,255,.07), rgba(255,255,255,0)); pointer-events: none; }
.quart .haut { position: relative; display: flex; align-items: center; gap: 2cqw; }
.quart h1 { margin: 0; flex: 1; min-width: 0; font-family: var(--noir); font-weight: 900; font-size: 4.3cqw; letter-spacing: -.045em; line-height: 1.05; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.quart .heureq { flex: none; font-family: var(--noir); font-weight: 900; font-size: 4.3cqw; letter-spacing: -.045em; line-height: 1.05; font-variant-numeric: tabular-nums; }
.equipeq { flex: none; display: flex; align-items: center; gap: .6cqw; }
.av { position: relative; flex: none; width: 3.3cqw; height: 3.3cqw; border-radius: 50%; display: grid; place-items: center; overflow: hidden; font-family: var(--texte); font-weight: 800; font-size: 1.45cqw; line-height: 1; color: #fff; background: #2B302D; box-shadow: 0 0 0 .22cqw #0B0D0C; }
.av img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.av.plus { background: rgba(255,255,255,.13); font-size: 1.2cqw; }
.av.neuf { animation: avEntre .7s cubic-bezier(.2,.9,.25,1) both; }
@keyframes avEntre { from { transform: scale(.3); opacity: 0; } to { transform: none; opacity: 1; } }

.quart .cols { position: relative; display: grid; grid-template-columns: repeat(var(--n, 4), minmax(0, 1fr)); gap: 1.3cqw; min-height: 0; }
.colq { display: flex; flex-direction: column; gap: .62cqw; min-height: 0; }
.colq > .libelle { display: flex; justify-content: space-between; padding: 0 .45cqw .25cqw; color: rgba(255,255,255,.42); font-size: 1.12cqw; letter-spacing: .13em; }
.colq > .libelle em { font-style: normal; font-variant-numeric: tabular-nums; }
.colq.toute > .libelle { color: var(--vert); }
.colq .encours { margin-top: auto; display: flex; flex-direction: column; gap: .62cqw; }

.tq { position: relative; display: flex; align-items: center; gap: .85cqw; min-height: 3.8cqw; padding: .55cqw .9cqw; border-radius: 1.2cqw; background: rgba(255,255,255,.055); box-shadow: inset 0 0 0 1px rgba(255,255,255,.075); transform-origin: top left; }
.tq .rond { flex: none; width: 1.75cqw; height: 1.75cqw; border-radius: 50%; box-shadow: inset 0 0 0 .17cqw rgba(255,255,255,.3); }
.tq .txt { flex: 1; min-width: 0; display: grid; gap: .12cqw; }
.tq .titre { font-size: 1.48cqw; font-weight: 600; letter-spacing: -.015em; line-height: 1.16; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.tq.en_cours { background: #fff; color: #111412; box-shadow: 0 .9cqw 2.2cqw rgba(0,0,0,.5); padding-right: 1.1cqw; }
.tq.en_cours .titre { font-weight: 700; }
.tq .qui { font-size: 1.05cqw; font-weight: 700; color: #6E746F; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tq .gens { flex: none; display: flex; }
.tq .gens .av { width: 2.35cqw; height: 2.35cqw; font-size: 1.02cqw; box-shadow: 0 0 0 .18cqw #fff; }
.tq .gens .av + .av { margin-left: -.65cqw; }
.tq .min { flex: none; text-align: right; line-height: .92; font-variant-numeric: tabular-nums; }

@keyframes vif { 0%, 100% { opacity: 1; } 50% { opacity: .2; } }

.quart .bas { position: relative; display: grid; gap: .85cqw; }
.quart .ligneq { display: flex; align-items: flex-end; justify-content: flex-end; }
.quart .compte { display: flex; align-items: baseline; gap: 0; font-family: var(--noir); font-weight: 900; font-size: 3.4cqw; letter-spacing: -.05em; line-height: .9; font-variant-numeric: tabular-nums; }
.quart .compte span { display: inline-block; }
.quart .compte i { font-style: normal; color: rgba(255,255,255,.3); }
.quart .compte small { font-family: var(--texte); font-size: 1.08cqw; font-weight: 700; letter-spacing: .14em; color: rgba(255,255,255,.42); margin-right: .9cqw; }
.quart .compte.fini span, .quart .compte.fini i { color: var(--vert); }
.quart .barre { position: relative; height: .6cqw; border-radius: 999px; background: rgba(255,255,255,.1); overflow: hidden; }
.quart .barre i { position: absolute; inset: 0 auto 0 0; width: 0; border-radius: inherit; background: var(--vert); overflow: hidden; transition: width 1.2s cubic-bezier(.2,.8,.2,1); }
.quart .barre i::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(255,255,255,0), rgba(255,255,255,.4), rgba(255,255,255,0)); transform: translateX(-100%); animation: reflet 3.4s ease-in-out infinite; }
@keyframes reflet { 55%, 100% { transform: translateX(100%); } }
.quart .faites { display: flex; gap: 1cqw; height: 5.3cqw; overflow: hidden; -webkit-mask-image: linear-gradient(90deg, #000 76%, transparent); mask-image: linear-gradient(90deg, #000 76%, transparent); }
.tf { position: relative; flex: none; display: flex; align-items: center; gap: .9cqw; max-width: 27cqw; padding: 0 1.3cqw 0 .9cqw; border-radius: 1.3cqw; background: rgba(255,255,255,.07); box-shadow: inset 0 0 0 1px rgba(255,255,255,.08); }
.tf .ok { flex: none; width: 2.7cqw; height: 2.7cqw; border-radius: 50%; background: var(--vert); display: grid; place-items: center; }
.tf .ok svg, .okf svg { width: 58%; height: 58%; display: block; }
.tf .t { min-width: 0; display: grid; gap: .1cqw; }
.tf .t b { font-size: 1.4cqw; font-weight: 700; letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tf .t span { font-size: 1.05cqw; font-weight: 600; color: rgba(255,255,255,.5); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.tf .temps small { font-family: var(--texte); font-size: .88cqw; font-weight: 800; letter-spacing: .12em; color: rgba(255,255,255,.5); margin-left: .25cqw; }
/* Le fantôme : la tâche finie passe au vert, se coche, puis file dans la bande du bas. */

.fantome .vif, .fantome .min { visibility: hidden; }
.okf { position: absolute; right: 1cqw; top: 50%; width: 2.8cqw; height: 2.8cqw; margin-top: -1.4cqw; border-radius: 50%; background: rgba(255,255,255,.22); display: grid; place-items: center; }

/* Trop de tâches pour l'écran : tout se resserre d'un cran, puis de deux (jamais coupé). */

<script>
(() => {
  const API = 'https://eewfbieadqiagthlsedf.supabase.co/functions/v1/ecran-backstore';
  const CLE = 'promo-ecran-backstore';
  const TZ = 'America/Toronto';
  const LECTURE_MS = 10000;
  // 14 nov. — les demandes du plancher se relisent seules, plus souvent (lecture légère).
  const APPELS_MS = 4000;
  const MAX_CMD = 4, MAX_CMD_SEUL = 6;
  // 13 nov. — la télé ne se recharge jamais : elle relit sa page toutes les 2 min et se
  // recharge quand une nouvelle version est publiée (changer VERSION à chaque envoi).
  const VERSION = '2026-11-21-1';
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const lireJeton = () => { try { return localStorage.getItem(CLE); } catch { return null; } };
  const garderJeton = (j) => { try { j ? localStorage.setItem(CLE, j) : localStorage.removeItem(CLE); } catch {} };

  /* ── L'heure du magasin ── */
  const FMT = new Intl.DateTimeFormat('fr-CA', { timeZone: TZ, hour: 'numeric', minute: '2-digit', hourCycle: 'h23' });
  const FMT_JOUR = new Intl.DateTimeFormat('fr-CA', { timeZone: TZ, weekday: 'long', day: 'numeric', month: 'long' });
  const FMT_CLE = new Intl.DateTimeFormat('en-CA', { timeZone: TZ, year: 'numeric', month: '2-digit', day: '2-digit' });
  const hm = (d) => FMT.format(d).replace(/\s*h\s*/, ':');
  const cleJour = (d) => FMT_CLE.format(d);
  function horloge() {
    const d = new Date();
    $('horloge').textContent = hm(d);
    $('jour').textContent = FMT_JOUR.format(d);
    $('quartHeure').textContent = hm(d);
  }

  /* ── Les sons ── */
  let ctx = null;
  function audio() {
    try { ctx = ctx || new (window.AudioContext || window.webkitAudioContext)(); } catch { ctx = null; }
    return ctx;
  }
  function bip(notes, volume) {
    const a = audio();
    if (!a || a.state !== 'running') return;
    notes.forEach(([f, t, d]) => {
      const o = a.createOscillator(), g = a.createGain(), t0 = a.currentTime + t;
      o.type = 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(volume, t0 + .02);
      g.gain.setValueAtTime(volume, t0 + d - .05); g.gain.linearRampToValueAtTime(0, t0 + d);
      o.connect(g).connect(a.destination); o.start(t0); o.stop(t0 + d + .02);
    });
  }
  const dingAppel = () => bip([[880, 0, .35], [1320, .2, .5]], .35);
  const carillon = () => bip([[659, 0, .5], [784, .28, .5], [988, .56, .9]], .25);
  function verifierSon() {
    const a = audio();
    if (a && a.state === 'suspended') a.resume().catch(() => {});
    setTimeout(() => { $('son').hidden = !(ctx && ctx.state !== 'running') || !$('porte').hidden; }, 400);
  }
  document.addEventListener('pointerdown', verifierSon);
  document.addEventListener('keydown', verifierSon);

  /* ── La fête des 100 clients (14 nov.) ── */
  const PALIER = 100, FETE_MS = 7000, CLE_FETE = 'promo-ecran-fete';
  // Deux notes douces, longues (pas une fanfare).
  const carillonFete = () => bip([[784, 0, 1.2], [1175, .16, 1.8]], .16);
  let feteEnCours = false;
  /** Les chiffres roulent, un après l'autre, des 100 d'avant jusqu'au palier. */
  function rouler(el, de, a) {
    const cible = String(a), depart = String(de).padStart(cible.length, '0');
    // Un signe qui n'est pas un chiffre (les deux-points d'une heure) reste fixe.
    el.innerHTML = [...cible].map((c) => (/\d/.test(c) ? `<span class="roue"><i>${[...'0123456789'].map((d) => `<b>${d}</b>`).join('').repeat(2)}</i></span>` : `<span>${esc(c)}</span>`)).join('');
    const roues = [...el.querySelectorAll('.roue > i')];
    const places = [...cible].map((c, i) => i).filter((i) => /\d/.test(cible[i]));
    const hauteur = 100 / 20;   // un chiffre = 5 % de la colonne (20 chiffres)
    roues.forEach((r, k) => { r.style.transition = 'none'; r.style.transform = `translateY(-${Number(depart[places[k]]) * hauteur}%)`; });
    void el.offsetHeight;
    roues.forEach((r, k) => {
      const i = places[k], avant = Number(depart[i]), apres = Number(cible[i]);
      // Toujours vers le haut : un chiffre qui ne monte pas fait un tour complet (2e jeu de chiffres).
      const pas = apres > avant ? apres : apres + 10;
      r.style.transition = ''; r.style.transitionDelay = `${.15 + (roues.length - 1 - k) * .1}s`;
      r.style.transform = `translateY(-${pas * hauteur}%)`;
    });
  }
  function feter(palier) {
    if (feteEnCours) return;
    feteEnCours = true;
    const el = $('fete');
    el.classList.remove('sort'); el.hidden = false;
    rouler($('feteChiffre'), Math.max(0, palier - PALIER), palier);
    carillonFete();
    setTimeout(() => el.classList.add('sort'), FETE_MS - 800);
    setTimeout(() => { el.hidden = true; feteEnCours = false; }, FETE_MS);
  }
  /** Le compte des clients du jour : une fête à chaque centaine franchie, une seule fois. */
  function noterClients(n) {
    const jour = cleJour(new Date()), atteint = Math.floor(n / PALIER) * PALIER;
    let vu = null;
    try { vu = JSON.parse(localStorage.getItem(CLE_FETE) || 'null'); } catch { vu = null; }
    const deja = vu && vu.jour === jour ? vu.palier : null;
    if (deja !== null && atteint <= deja) return;
    try { localStorage.setItem(CLE_FETE, JSON.stringify({ jour, palier: atteint })); } catch {}
    // La première lecture du jour note le palier sans fête (il a été franchi avant).
    if (deja !== null && atteint > 0) feter(atteint);
  }

  /* ── Une commande en ligne rentre (14 nov.) ── */
  const ARRIVEE_MS = 2600;
  /** Le son d'une commande (14 nov.) : Keven, les notes tenues « ressemblent trop aux autres », les
   *  « bloups » = « bizarre ». Donc un « ding-dong » de porte de magasin, qui DESCEND (tous les autres
   *  sons de la télé montent), avec un timbre de cloche : une attaque nette, une longue fin douce. */
  function carillonCommande() {
    const a = audio();
    if (!a || a.state !== 'running') return;
    const cloche = (f, t, fin) => {
      [[f, .3, fin], [f * 2, .08, fin * .6], [f * 3, .03, fin * .35]].forEach(([hz, vol, d]) => {

        const cles = new Set(j.demandesEtiq.map((a) => `${a.id}:${a.fois}`));
        if (vusEtiq) for (const k of cles) if (!vusEtiq.has(k)) etiqNeuve = true;
        vusEtiq = cles;
      }
      const n = j.etiquettes ? j.etiquettes.aImprimer : avantEtiq;
      // 21 nov. — une ligne de la file qu'on n'avait jamais vue = UN carillon (même s'il en attendait déjà d'autres).
      // Une ligne déjà vue ne resonne jamais ; la première lecture est muette ; on garde ce qu'on a vu.
      let ligneNeuve = false;
      if (j.etiquettes && Array.isArray(j.etiquettes.cles)) {
        if (vusLignes) for (const k of j.etiquettes.cles) if (!vusLignes.has(k)) ligneNeuve = true;
        vusLignes = new Set([...(vusLignes ?? []), ...j.etiquettes.cles].slice(-600));
      }
      // Une fonction sans les clés (ancienne) : le vieux repère, la file passe de 0 à quelque chose.
      const ancien = !(j.etiquettes && Array.isArray(j.etiquettes.cles)) && avantEtiq !== null && n > 0 && avantEtiq === 0;
      if (etiqNeuve || ligneNeuve || ancien) carillon();
      else if (neuves.size) dingAppel();
      avantEtiq = n;
      montrerEcran();
      dessiner(neuves);
      // Une commande pas prête qu'on n'avait pas à la lecture d'avant : l'annonce (la plus proche d'abord).
      if (j.commandes) {
        const ouvertes = j.commandes.filter((o) => !o.prete && !o.verif);
        const cmdNeuves = vusCmd ? ouvertes.filter((o) => !vusCmd.has(o.id)) : [];
        vusCmd = new Set([...(vusCmd ?? []), ...ouvertes.map((o) => o.id)].slice(-400));
        if (cmdNeuves.length) annoncer(cmdNeuves.sort((a, b) => new Date(a.cueillette) - new Date(b.cueillette)));
      }
      if (typeof j.clients === 'number') noterClients(j.clients);
    } catch {
      if (etat) dessinerCotes();
    }
  }

  function montrerEcran() {
    $('porte').hidden = true;
    const quart = !!(etat && etat.quart && etat.quart.tele);
    $('ecran').hidden = quart; $('quart').hidden = !quart;
    document.body.style.cursor = 'none';
  }
  function montrerPorte() {
    $('ecran').hidden = true; $('quart').hidden = true; $('porte').hidden = false; $('son').hidden = true; document.body.style.cursor = 'auto';
    setTimeout(() => $('code').focus(), 50);
  }

  $('formCode').addEventListener('submit', async (e) => {
    e.preventDefault();
    verifierSon();
    const code = $('code').value.replace(/\D/g, '');
    $('erreur').textContent = '';
    if (code.length !== 6) { $('erreur').textContent = 'Le code a 6 chiffres.'; return; }
    try {
      const r = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ code }) });
      const j = await r.json().catch(() => ({}));
      if (!r.ok || !j.jeton) { $('erreur').textContent = j.error || 'Mauvais code.'; $('code').select(); return; }
      garderJeton(j.jeton);
      $('code').value = '';
      await lire();
    } catch {
      $('erreur').textContent = 'Pas de réseau. Réessaie.';
    }
  });

  async function nouvelleVersion() {
    try {
      const r = await fetch(location.pathname + '?v=' + Date.now(), { cache: 'no-store' });
      if (!r.ok) return;
      const t = await r.text();
      const m = t.match(/const VERSION = '([^']+)'/);
      if (m && m[1] !== VERSION) location.replace(location.pathname + '?v=' + encodeURIComponent(m[1]));
    } catch {}
  }
  setInterval(nouvelleVersion, 120000);

  horloge(); setInterval(horloge, 5000);
  // ?demo=commande : un aperçu de la commande qui rentre (un clic la rejoue).
  // ?demo=300 : un aperçu de la fête avec de fausses demandes, sans code ni réseau (un clic la rejoue).
  const DEMO = new URLSearchParams(location.search).get('demo');
  // ?demo=close · ?demo=ouverture : l'écran du quart avec de fausses tâches (19 nov.). Toutes les
  // 3,5 s (et à chaque toucher) une tâche avance : prise, aidée, finie. &fixe=1 : rien ne bouge.
  if (DEMO === 'close' || DEMO === 'ouverture') {
    const il = (min) => new Date(Date.now() - min * 60000).toISOString();
    const P = { F: { id: 'f', prenom: 'Félix', couleur: '#2E9BD6' }, E: { id: 'e', prenom: 'Éléanore', couleur: '#C23A6A' }, S: { id: 's', prenom: 'Sherley', couleur: '#5B3FC4' }, M: { id: 'm', prenom: 'Mika', couleur: '#E8B21C' }, J: { id: 'j', prenom: 'Justine', couleur: '#157A5A' } };
    const L = DEMO === 'close'
      ? [['Caisse', 'Laver le dessus des 3 caisses', 'fait', 'E', 14, 9], ['Caisse', 'Vider la poubelle de chaque caisse', 'fait', 'E', 5, 2], ['Caisse', 'Ramasser l’argent et le placer', 'en_cours', 'F', 6], ['Caisse', 'Rapporter chaque iPad en arrière', 'libre'],
         ['Comptoirs', 'Remplir seulement ceux pas réfrigérés', 'en_cours', 'SM', 22], ['Comptoirs', 'Remplir les patates', 'fait', 'M', 18, 11], ['Comptoirs', 'Nettoyer le dessous des comptoirs et les tablettes', 'libre'], ['Comptoirs', 'Replacer les paniers à l’entrée', 'libre'],
         ['Backstore', 'Balai', 'fait', 'M', 7, 6], ['Backstore', 'Nettoyer les postes de travail', 'libre'], ['Backstore', 'Fermer la plastifieuse et la wrappeuse', 'libre'], ['Backstore', 'Défaire les boîtes', 'libre'], ['Backstore', 'Défaire les palettes et les sortir', 'libre'], ['Backstore', 'Défaire les commandes pas ramassées', 'fait', 'F', 31, 19], ['Backstore', 'Jeter les poubelles et les pertes', 'libre'], ['Backstore', 'Salle de bain et aire de pause', 'libre'],
         ['Chambre froide', 'Optimiser l’espace', 'libre'], ['Chambre froide', 'Vérifier la disponibilité des produits', 'libre'], ['Chambre froide', 'Balai', 'libre'], ['Chambre froide', 'Défaire les boîtes', 'libre'], ['Chambre froide', 'Fermer la porte et la lumière', 'libre'],
         ['Fin', 'Balai et moppe à l’avant', 'libre'], ['Fin', 'Fermer les lumières et barrer la porte', 'libre']]
      : [['Avant', 'Alarme désactivée, entrée poinçonnée', 'fait', 'F', 48, 46], ['Avant', 'Lumières et écrans de prix allumés', 'fait', 'F', 45, 41], ['Avant', 'Tour du magasin : propreté', 'en_cours', 'F', 12], ['Avant', 'Étalages remplis et facés', 'en_cours', 'EM', 34], ['Avant', 'Vitrine, porte et entrée propres', 'libre'],
         ['Caisse', 'Caisse ouverte avec fond de 200 $', 'fait', 'E', 40, 33], ['Caisse', 'Balance propre, à niveau et à zéro', 'libre'], ['Caisse', 'Musique : liste approuvée, volume modéré', 'libre'],
         ['Chambre froide', 'Températures inscrites dans l’app', 'fait', 'F', 30, 26], ['Fin', 'Porte déverrouillée à l’heure', 'libre']];
    etat = { appels: [], commandes: [], etiquettes: { aImprimer: 0 }, camions: null, demandesEtiq: [],
      quart: { genre: DEMO, tele: true, maintenant: new Date().toISOString(), rejoints: [P.F, P.E, P.S, P.M],
        taches: L.map(([zone, titre, e, gens, pris, fini], i) => ({ id: `d${i}`, zone, titre, etat: e, equipe: [...(gens || '')].map((k) => P[k]), pris_le: pris ? il(pris) : null, fait_le: e === 'fait' ? il(fini) : null })) } };
    derniereReussite = Date.now();
    montrerEcran(); dessiner();
    let pas = 0;
    const avancer = () => {
      const q = etat.quart, t = q.taches;
      pas += 1;
      if (pas === 3 && !q.rejoints.some((p) => p.id === 'j')) q.rejoints = [...q.rejoints, P.J];
      const enCours = t.filter((x) => x.etat === 'en_cours'), libres = t.filter((x) => x.etat === 'libre');
      const maintenant = new Date().toISOString();
      if (enCours.length && (!libres.length || pas % 2 === 0)) {
        const x = enCours.sort((a, b) => Date.parse(a.pris_le) - Date.parse(b.pris_le))[0];
        x.etat = 'fait'; x.fait_le = maintenant;
      } else if (libres.length) {
        const x = libres[Math.floor(Math.random() * libres.length)], gens = q.rejoints;
        x.etat = 'en_cours'; x.pris_le = maintenant; x.equipe = [gens[Math.floor(Math.random() * gens.length)]];
        if (pas % 5 === 0) x.equipe.push(gens[(gens.indexOf(x.equipe[0]) + 1) % gens.length]);
      } else return;
      dessiner();
    };
    document.addEventListener('pointerdown', avancer);
    if (!new URLSearchParams(location.search).has('fixe')) setInterval(avancer, 3500);
    setInterval(() => dessiner(), 30000);
    return;
  }
  // ?demo=verif : 1 vérifiée (verte), 3 à vérifier (la plus vieille pulse), le reste pas prêtes (20 nov.).
  if (DEMO === 'verif') {
    const dans = (min) => new Date(Date.now() + min * 60000).toISOString(), avant = (min) => new Date(Date.now() - min * 60000).toISOString();
    etat = { appels: [], etiquettes: { aImprimer: 0 }, camions: null, demandesEtiq: [], quart: null,
      commandes: [{ id: 'v1', cueillette: dans(25), prete: true, verif: 'verifiee' },
        { id: 'j1', cueillette: dans(10), prete: false, verif: 'a_verifier', depuis: avant(7) },
        { id: 'j2', cueillette: dans(30), prete: false, verif: 'a_verifier', depuis: avant(2) },
        { id: 'c3', cueillette: dans(50), prete: false, enPrep: true }] };
    derniereReussite = Date.now();
    montrerEcran(); dessiner();
    setInterval(() => dessiner(), 30000);
    return;
  }
  if (DEMO !== null) {
    const palier = Math.max(PALIER, Math.round((Number(DEMO) || PALIER) / PALIER) * PALIER);
    etat = { appels: [{ id: 'f', nom: 'Ananas', photo: null, plancher: '1', fois: 1, fait: DEMO === 'fait' }, { id: 'a', nom: 'Bleuet', photo: null, plancher: '1', fois: 1 }, { id: 'b', nom: 'Melon d’eau quartier', photo: null, plancher: '2', fois: 2 }],
      commandes: DEMO === 'commande' ? [{ id: 'c1', cueillette: new Date(Date.now() + 20 * 60000).toISOString(), prete: true }, { id: 'c2', cueillette: new Date(Date.now() + 9 * 60000).toISOString(), prete: false, enPrep: true, prepDepuis: new Date(Date.now() - 14 * 60000).toISOString() }, { id: 'c3', cueillette: new Date(Date.now() + 50 * 60000).toISOString(), prete: false, enPrep: true }, { id: 'c4', cueillette: new Date(Date.now() + 95 * 60000).toISOString(), prete: false, boite: 'Boîte liquidation', enPrep: true, prepDepuis: new Date(Date.now() - 6 * 60000).toISOString() }, { id: 'c5', cueillette: new Date(Date.now() + 160 * 60000).toISOString(), prete: false }, { id: 'c6', cueillette: new Date(Date.now() + 26 * 3600000).toISOString(), prete: false }] : DEMO === 'fait' ? [{ id: 'c1', cueillette: new Date(Date.now() + 40 * 60000).toISOString(), prete: true }, { id: 'c2', cueillette: new Date(Date.now() + 12 * 60000).toISOString(), prete: false }, { id: 'c3', cueillette: new Date(Date.now() + 95 * 60000).toISOString(), prete: false }] : [], etiquettes: { aImprimer: 0 }, camions: null,
      demandesEtiq: DEMO === 'etiquette' ? [{ id: 'e1', nom: 'Canneberges', plancher: '1', fois: 1, quantite: 1, format: 'grande' }, { id: 'e2', nom: 'Melon miel', plancher: '1', fois: 1, quantite: 2, format: 'petite' }] : [] };
    derniereReussite = Date.now();
    montrerEcran(); dessiner();
    if (DEMO === 'commande') {
      const fausse = () => annoncer([{ id: 'n', cueillette: new Date(Date.now() + 75 * 60000).toISOString(), prete: false, boite: 'Boîte liquidation' }]);
      setTimeout(fausse, 700); document.addEventListener('pointerdown', fausse);
    } else if (DEMO !== 'etiquette' && DEMO !== 'fait') { setTimeout(() => feter(palier), 700); document.addEventListener('pointerdown', () => feter(palier)); }
    return;
  }
  setInterval(() => lire(), LECTURE_MS);
  setInterval(() => lire(true), APPELS_MS);
  setInterval(() => dessiner(), 30000);   // les minutes avancent même sans nouvelle lecture
  garderAllume();
  lire().then(verifierSon);
})();
